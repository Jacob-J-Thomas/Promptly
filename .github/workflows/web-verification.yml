name: Web verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-verification:
    name: Web verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Promptly.Web/src/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: Promptly.Web/src/web/.node-version
          cache: npm
          cache-dependency-path: Promptly.Web/src/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint without warnings
        run: npm run lint -- --max-warnings=0

      - name: Verify E2E harness safety
        run: npm run test:e2e:harness

      - name: Clean web verification artifacts
        shell: pwsh
        run: |
          Remove-Item ../../../artifacts/test-results/web -Recurse -Force -ErrorAction SilentlyContinue
          New-Item ../../../artifacts/test-results/web -ItemType Directory -Force | Out-Null

      - name: Audit locked dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json \
            > ../../../artifacts/test-results/web/npm-audit.json
          full_audit_status=$?
          npm audit --omit=dev --audit-level=high --json \
            > ../../../artifacts/test-results/web/npm-audit-production.json
          production_audit_status=$?
          set -e

          FULL_AUDIT_PATH=../../../artifacts/test-results/web/npm-audit.json \
          PRODUCTION_AUDIT_PATH=../../../artifacts/test-results/web/npm-audit-production.json \
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const loadCounts = (label, path) => {
            const report = JSON.parse(readFileSync(path, "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (!counts) {
              throw new Error(`${label} npm audit did not return vulnerability metadata`);
            }
            console.log(`${label} npm audit: ${JSON.stringify(counts)}`);
            return counts;
          };

          const full = loadCounts("Full", process.env.FULL_AUDIT_PATH);
          const production = loadCounts("Production", process.env.PRODUCTION_AUDIT_PATH);
          if (full.high !== 0 || full.critical !== 0) {
            throw new Error("Full npm audit contains high or critical findings");
          }
          if (production.high !== 0 || production.critical !== 0) {
            throw new Error("Production npm audit contains high or critical findings");
          }
          NODE

          if (( full_audit_status > 1 || production_audit_status > 1 )); then
            echo "npm audit failed before producing a valid report" >&2
            exit 1
          fi

      - name: Run web unit tests and coverage gate
        run: npm run test:coverage

      - name: Require covered authentication and authoring UI sources
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const reportPath = "../../../artifacts/test-results/web/coverage/coverage-final.json";
          const report = JSON.parse(readFileSync(reportPath, "utf8"));
          const requiredSources = [
            "src/api/errors.ts",
            "src/authenticationInputLimits.ts",
            "src/pages/Login.tsx",
            "src/pages/Register.tsx",
            "src/components/RunConfigDialog.tsx",
            "src/components/MessageListEditor.tsx",
            "src/components/messageSpec.ts",
            "src/components/ExpectationListEditor.tsx",
            "src/components/expectationSpec.ts",
            "src/components/strictJson.ts",
            "src/components/TestCaseDialog.tsx",
            "src/components/testCaseYaml.ts",
            "src/pages/SuiteDetail.tsx",
          ];

          for (const sourcePath of requiredSources) {
            const matches = Object.entries(report).filter(([path]) =>
              path.replaceAll("\\", "/").endsWith(`/${sourcePath}`));
            if (matches.length !== 1) {
              throw new Error(
                `Expected one web coverage source for ${sourcePath}; found ${matches.length}`,
              );
            }

            const [, source] = matches[0];
            const lineHits = new Map();
            for (const [statementId, location] of Object.entries(source.statementMap)) {
              const line = location.start.line;
              const hits = source.s[statementId];
              lineHits.set(line, Math.max(lineHits.get(line) ?? 0, hits));
            }
            if (lineHits.size === 0) {
              throw new Error(`Coverage JSON has no executable lines for ${sourcePath}`);
            }

            const branchHits = Object.values(source.b).flat();
            const coveredLines = [...lineHits.values()].filter((hits) => hits > 0).length;
            const coveredBranches = branchHits.filter((hits) => hits > 0).length;
            const lineRate = coveredLines / lineHits.size;
            const branchRate = branchHits.length === 0
              ? 1
              : coveredBranches / branchHits.length;
            if (lineRate < 0.90 || branchRate < 0.90) {
              throw new Error(
                `Coverage for ${sourcePath} is below 90%: line=${lineRate} branch=${branchRate}`,
              );
            }
            console.log(
              `${sourcePath}: line=${(lineRate * 100).toFixed(2)}% branch=${(branchRate * 100).toFixed(2)}%`,
            );
          }
          NODE

      - name: Build release bundle
        run: npm run build

      - name: Require verification artifacts
        shell: pwsh
        run: |
          $requiredArtifacts = @(
            "../../../artifacts/test-results/web/junit.xml",
            "../../../artifacts/test-results/web/coverage/cobertura-coverage.xml",
            "../../../artifacts/test-results/web/coverage/coverage-final.json",
            "../../../artifacts/test-results/web/npm-audit.json",
            "../../../artifacts/test-results/web/npm-audit-production.json"
          )
          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path -Path $artifact -PathType Leaf) -or (Get-Item $artifact).Length -eq 0) {
              throw "Required verification artifact is missing or empty: $artifact"
            }
          }

      - name: Upload test, coverage, and dependency-audit artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-results
          path: artifacts/test-results/web
          if-no-files-found: error
          retention-days: 14
