name: Application verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-verification:
    name: Application verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Promptly.slnx --locked-mode

      - name: Build
        run: dotnet build Promptly.slnx --configuration Release --no-restore --warnaserror

      - name: Verify C# formatting
        run: dotnet format Promptly.slnx --verify-no-changes --no-restore

      - name: Clean application test artifacts
        shell: pwsh
        run: |
          Remove-Item artifacts/test-results/csharp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item artifacts/test-results/csharp -ItemType Directory -Force | Out-Null

      - name: Inventory vulnerable .NET dependencies
        shell: pwsh
        run: |
          dotnet package list `
            --project Promptly.slnx `
            --vulnerable `
            --include-transitive `
            --format json `
            --no-restore `
            | Out-File artifacts/test-results/csharp/dotnet-vulnerabilities.json -Encoding utf8

      - name: Require clean dependency-scan cohort
        shell: pwsh
        run: |
          $scan = Get-Content artifacts/test-results/csharp/dotnet-vulnerabilities.json -Raw | ConvertFrom-Json
          $expectedProjects = @(
            "Promptly.Application/Promptly.Application.csproj"
            "Promptly.Cli/Promptly.Cli.csproj"
            "Promptly.Domain/Promptly.Domain.csproj"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj"
            "Promptly.Sdk.DotNet/Promptly.Sdk.DotNet.csproj"
            "Promptly.Server/Promptly.Server.csproj"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj"
            "tests/Promptly.IntegrationTests/Promptly.IntegrationTests.csproj"
          ) | Sort-Object
          $actualProjects = @(
            $scan.projects.path | ForEach-Object {
              [IO.Path]::GetRelativePath((Get-Location).Path, $_).Replace('\', '/')
            }
          ) | Sort-Object
          $projectDifference = Compare-Object $expectedProjects $actualProjects
          if ($projectDifference) {
            throw "Unexpected .NET dependency-scan cohort: $($projectDifference | Out-String)"
          }

          $actualFindings = @()
          foreach ($project in $scan.projects) {
            $projectPath = [IO.Path]::GetRelativePath((Get-Location).Path, $project.path)
            $projectPath = $projectPath.Replace('\', '/')
            foreach ($framework in @($project.frameworks)) {
              $targetFramework = ([string]$framework.framework).Trim().ToLowerInvariant()
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages) `
                | Where-Object { $_ }
              foreach ($package in $packages) {
                foreach ($finding in @($package.vulnerabilities) | Where-Object { $_ }) {
                  $advisory = $finding.advisoryurl -replace '^.*/', ''
                  $actualFindings += "$projectPath|$targetFramework|$($package.id)|$($package.resolvedVersion)|$($finding.severity)|$advisory"
                }
              }
            }
          }
          $actualFindings = @($actualFindings | Sort-Object -Unique)
          if ($actualFindings.Count -gt 0) {
            throw "Vulnerable .NET dependencies reported: $($actualFindings -join ', ')"
          }
          Write-Host "No vulnerable .NET dependencies reported"

      - name: Run application unit tests and coverage gate
        run: >-
          dotnet test tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj
          --configuration Release
          --no-build
          --settings tests/Promptly.runsettings
          --logger "trx;LogFileName=Promptly.Application.UnitTests.trx"
          --results-directory artifacts/test-results/csharp

      - name: Require complete measured C# cohort
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content artifacts/test-results/csharp/coverage/coverage.cobertura.xml -Raw
          $packages = @($coverage.coverage.packages.package)
          $expectedAssemblies = @(
            "Promptly.Application"
            "Promptly.Infrastructure"
            "Promptly.Server"
          ) | Sort-Object
          $actualAssemblies = @(
            $packages |
              Where-Object { @($_.classes.class).Count -gt 0 } |
              ForEach-Object { [string]$_.name }
          ) | Sort-Object
          $assemblyDifference = Compare-Object $expectedAssemblies $actualAssemblies
          if ($assemblyDifference) {
            throw "Unexpected measured C# assembly cohort: $($assemblyDifference | Out-String)"
          }

          function Get-RepositoryRelativePath([string]$path) {
            $fullPath = if ([IO.Path]::IsPathRooted($path)) {
              [IO.Path]::GetFullPath($path)
            }
            else {
              [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $path))
            }
            return [IO.Path]::GetRelativePath((Get-Location).Path, $fullPath).Replace('\', '/')
          }

          $expectedInfrastructureSources = @(
            Get-ChildItem Promptly.Infrastructure -Filter *.cs -Recurse |
              Where-Object { $_.FullName -notmatch '[/\\](bin|obj)[/\\]' } |
              ForEach-Object { Get-RepositoryRelativePath $_.FullName }
          ) | Sort-Object -Unique
          $infrastructurePackage = $packages |
            Where-Object { $_.name -eq "Promptly.Infrastructure" } |
            Select-Object -First 1
          $actualInfrastructureSources = @(
            $infrastructurePackage.classes.class |
              ForEach-Object { Get-RepositoryRelativePath ([string]$_.filename) }
          ) | Sort-Object -Unique
          $infrastructureDifference = Compare-Object `
            $expectedInfrastructureSources `
            $actualInfrastructureSources
          if ($infrastructureDifference) {
            throw "Incomplete Infrastructure coverage source cohort: $($infrastructureDifference | Out-String)"
          }

          $expectedApplicationSources = @(
            "Promptly.Application/Data/TenantOwnedQueries.cs"
            "Promptly.Application/Services/BoundedRegexMatcher.cs"
            "Promptly.Application/Services/EndpointService.cs"
            "Promptly.Application/Services/EnvironmentService.cs"
            "Promptly.Application/Services/ExpectationEvaluator.cs"
            "Promptly.Application/Services/MappingService.cs"
            "Promptly.Application/Services/ProjectService.cs"
            "Promptly.Application/Services/TestCaseService.cs"
            "Promptly.Application/Services/TestRunService.cs"
            "Promptly.Application/Services/TestRunWorkerStore.cs"
            "Promptly.Application/Services/TestSuiteService.cs"
          ) | Sort-Object
          $applicationPackage = $packages |
            Where-Object { $_.name -eq "Promptly.Application" } |
            Select-Object -First 1
          $actualApplicationSources = @(
            $applicationPackage.classes.class |
              ForEach-Object { Get-RepositoryRelativePath ([string]$_.filename) }
          ) | Sort-Object -Unique
          $applicationDifference = Compare-Object `
            $expectedApplicationSources `
            $actualApplicationSources
          if ($applicationDifference) {
            throw "Unexpected scoped Application coverage cohort: $($applicationDifference | Out-String)"
          }

          $expectedServerSources = @(
            "Promptly.Server/Controllers/EndpointsController.cs"
            "Promptly.Server/Controllers/EnvironmentsController.cs"
            "Promptly.Server/Controllers/MappingController.cs"
            "Promptly.Server/Controllers/ProjectsController.cs"
            "Promptly.Server/Controllers/RunsController.cs"
            "Promptly.Server/Controllers/TestSuitesController.cs"
            "Promptly.Server/Controllers/TestsController.cs"
            "Promptly.Server/Security/HttpContextTenantAccessScopeAccessor.cs"
            "Promptly.Server/Security/TenantAccessScopeFactory.cs"
            "Promptly.Server/Security/TenantAuthenticationSchemeSelector.cs"
          ) | Sort-Object
          $serverPackage = $packages |
            Where-Object { $_.name -eq "Promptly.Server" } |
            Select-Object -First 1
          $actualServerSources = @(
            $serverPackage.classes.class |
              ForEach-Object { Get-RepositoryRelativePath ([string]$_.filename) }
          ) | Sort-Object -Unique
          $serverDifference = Compare-Object `
            $expectedServerSources `
            $actualServerSources
          if ($serverDifference) {
            throw "Unexpected scoped Server coverage cohort: $($serverDifference | Out-String)"
          }

          foreach ($package in @($applicationPackage, $infrastructurePackage, $serverPackage)) {
            $lineRate = [double]::Parse(
              [string]$package.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            $branchRate = [double]::Parse(
              [string]$package.'branch-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($lineRate -lt 0.90 -or $branchRate -lt 0.90) {
              throw "Coverage for $($package.name) is below 90%: line=$lineRate branch=$branchRate"
            }
            Write-Host "$($package.name): line=$('{0:P2}' -f $lineRate) branch=$('{0:P2}' -f $branchRate)"
          }

          $requiredApplicationClasses = @(
            "Promptly.Application.Data.TenantOwnedQueries"
            "Promptly.Application.Services.BoundedRegexMatcher"
            "Promptly.Application.Services.EndpointService"
            "Promptly.Application.Services.EnvironmentService"
            "Promptly.Application.Services.ExpectationEvaluator"
            "Promptly.Application.Services.MappingService"
            "Promptly.Application.Services.MappingSpecValidationException"
            "Promptly.Application.Services.ProjectService"
            "Promptly.Application.Services.TestCaseService"
            "Promptly.Application.Services.TestRunService"
            "Promptly.Application.Services.TestRunWorkerStore"
            "Promptly.Application.Services.TestSuiteService"
          ) | Sort-Object
          $actualTopLevelClasses = @(
            $applicationPackage.classes.class |
              Where-Object { ([string]$_.name) -notmatch '/' } |
              ForEach-Object { [string]$_.name }
          ) | Sort-Object -Unique
          $classDifference = Compare-Object $requiredApplicationClasses $actualTopLevelClasses
          if ($classDifference) {
            throw "Unexpected top-level Application coverage class cohort: $($classDifference | Out-String)"
          }
          foreach ($className in $requiredApplicationClasses) {
            $class = @($applicationPackage.classes.class) |
              Where-Object { $_.name -eq $className } |
              Select-Object -First 1
            if (-not $class) {
              throw "Required covered class is missing: $className"
            }
            $classLineRate = [double]::Parse(
              [string]$class.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            $classBranchRate = [double]::Parse(
              [string]$class.'branch-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($classLineRate -lt 0.90 -or $classBranchRate -lt 0.90) {
              throw "Coverage for $className is below 90%: line=$classLineRate branch=$classBranchRate"
            }
            Write-Host "${className}: line=$('{0:P2}' -f $classLineRate) branch=$('{0:P2}' -f $classBranchRate)"
          }

          $requiredServerClasses = @(
            "Promptly.Server.Controllers.EndpointsController"
            "Promptly.Server.Controllers.EnvironmentsController"
            "Promptly.Server.Controllers.MappingController"
            "Promptly.Server.Controllers.ProjectsController"
            "Promptly.Server.Controllers.RunsController"
            "Promptly.Server.Controllers.TestSuitesController"
            "Promptly.Server.Controllers.TestsController"
            "Promptly.Server.Security.HttpContextTenantAccessScopeAccessor"
            "Promptly.Server.Security.TenantAccessScopeFactory"
            "Promptly.Server.Security.TenantAuthenticationSchemeSelector"
          ) | Sort-Object
          $actualTopLevelServerClasses = @(
            $serverPackage.classes.class |
              Where-Object { ([string]$_.name) -notmatch '/' } |
              ForEach-Object { [string]$_.name }
          ) | Sort-Object -Unique
          $serverClassDifference = Compare-Object `
            $requiredServerClasses `
            $actualTopLevelServerClasses
          if ($serverClassDifference) {
            throw "Unexpected top-level Server coverage class cohort: $($serverClassDifference | Out-String)"
          }
          foreach ($className in $requiredServerClasses) {
            $class = @($serverPackage.classes.class) |
              Where-Object { $_.name -eq $className } |
              Select-Object -First 1
            if (-not $class) {
              throw "Required covered class is missing: $className"
            }
            $classLineRate = [double]::Parse(
              [string]$class.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            $classBranchRate = [double]::Parse(
              [string]$class.'branch-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($classLineRate -lt 0.90 -or $classBranchRate -lt 0.90) {
              throw "Coverage for $className is below 90%: line=$classLineRate branch=$classBranchRate"
            }
            Write-Host "${className}: line=$('{0:P2}' -f $classLineRate) branch=$('{0:P2}' -f $classBranchRate)"
          }

          # Coverlet represents async method bodies as generated nested classes.
          # Enforce the threshold by source file as well as package so an exact
          # top-level class filter cannot accidentally count only constructors.
          $coverageJson = Get-Content artifacts/test-results/csharp/coverage/coverage.json -Raw |
            ConvertFrom-Json -AsHashtable

          function Get-SourceCoverage(
            [string]$assemblyName,
            [string]$sourcePath
          ) {
            $assembly = $coverageJson["$assemblyName.dll"]
            if (-not $assembly) {
              throw "Coverage JSON is missing assembly $assemblyName"
            }

            $sourceKeys = @(
              $assembly.Keys |
                Where-Object { (Get-RepositoryRelativePath ([string]$_)) -eq $sourcePath }
            )
            if ($sourceKeys.Count -ne 1) {
              throw "Expected one coverage JSON source for ${sourcePath}; found $($sourceKeys.Count)"
            }

            $lineHits = @{}
            $branchHits = @{}
            foreach ($classEntry in $assembly[$sourceKeys[0]].GetEnumerator()) {
              foreach ($methodEntry in $classEntry.Value.GetEnumerator()) {
                $method = $methodEntry.Value
                foreach ($line in $method.Lines.GetEnumerator()) {
                  $hits = [int]$line.Value
                  if (-not $lineHits.ContainsKey($line.Key) -or $hits -gt $lineHits[$line.Key]) {
                    $lineHits[$line.Key] = $hits
                  }
                }
                foreach ($branch in @($method.Branches)) {
                  if (-not $branch) {
                    continue
                  }
                  $branchKey = @(
                    $classEntry.Key
                    $methodEntry.Key
                    $branch.Line
                    $branch.Offset
                    $branch.EndOffset
                    $branch.Path
                    $branch.Ordinal
                  ) -join '|'
                  $hits = [int]$branch.Hits
                  if (-not $branchHits.ContainsKey($branchKey) -or $hits -gt $branchHits[$branchKey]) {
                    $branchHits[$branchKey] = $hits
                  }
                }
              }
            }

            if ($lineHits.Count -eq 0) {
              throw "Coverage JSON has no executable lines for ${sourcePath}"
            }

            $coveredLines = @($lineHits.Values | Where-Object { $_ -gt 0 }).Count
            $coveredBranches = @($branchHits.Values | Where-Object { $_ -gt 0 }).Count
            return [pscustomobject]@{
              LineRate = $coveredLines / $lineHits.Count
              BranchRate = if ($branchHits.Count -eq 0) {
                1.0
              }
              else {
                $coveredBranches / $branchHits.Count
              }
            }
          }

          foreach ($sourcePath in $expectedApplicationSources) {
            $sourceCoverage = Get-SourceCoverage "Promptly.Application" $sourcePath
            if ($sourceCoverage.LineRate -lt 0.90 -or $sourceCoverage.BranchRate -lt 0.90) {
              throw "Coverage for $sourcePath is below 90%: line=$($sourceCoverage.LineRate) branch=$($sourceCoverage.BranchRate)"
            }
            Write-Host "${sourcePath}: line=$('{0:P2}' -f $sourceCoverage.LineRate) branch=$('{0:P2}' -f $sourceCoverage.BranchRate)"
          }

          foreach ($sourcePath in $expectedServerSources) {
            $sourceCoverage = Get-SourceCoverage "Promptly.Server" $sourcePath
            if ($sourceCoverage.LineRate -lt 0.90 -or $sourceCoverage.BranchRate -lt 0.90) {
              throw "Coverage for $sourcePath is below 90%: line=$($sourceCoverage.LineRate) branch=$($sourceCoverage.BranchRate)"
            }
            Write-Host "${sourcePath}: line=$('{0:P2}' -f $sourceCoverage.LineRate) branch=$('{0:P2}' -f $sourceCoverage.BranchRate)"
          }

      - name: Require test and coverage artifacts
        shell: pwsh
        run: |
          $requiredArtifacts = @(
            "artifacts/test-results/csharp/Promptly.Application.UnitTests.trx",
            "artifacts/test-results/csharp/coverage/coverage.cobertura.xml",
            "artifacts/test-results/csharp/coverage/coverage.json",
            "artifacts/test-results/csharp/dotnet-vulnerabilities.json"
          )
          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path -Path $artifact -PathType Leaf) -or (Get-Item $artifact).Length -eq 0) {
              throw "Required verification artifact is missing or empty: $artifact"
            }
          }

      - name: Upload test and coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-test-results
          path: artifacts/test-results/csharp
          if-no-files-found: error
          retention-days: 14
