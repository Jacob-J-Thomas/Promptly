name: Application verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-verification:
    name: Application verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Promptly.slnx --locked-mode

      - name: Build
        run: dotnet build Promptly.slnx --configuration Release --no-restore --warnaserror

      - name: Verify C# formatting
        run: dotnet format Promptly.slnx --verify-no-changes --no-restore

      - name: Clean application test artifacts
        shell: pwsh
        run: |
          Remove-Item artifacts/test-results/csharp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item artifacts/test-results/csharp -ItemType Directory -Force | Out-Null

      - name: Inventory vulnerable .NET dependencies
        shell: pwsh
        run: |
          dotnet package list `
            --project Promptly.slnx `
            --vulnerable `
            --include-transitive `
            --format json `
            --no-restore `
            | Out-File artifacts/test-results/csharp/dotnet-vulnerabilities.json -Encoding utf8

      - name: Require clean dependency-scan cohort
        shell: pwsh
        run: |
          $scan = Get-Content artifacts/test-results/csharp/dotnet-vulnerabilities.json -Raw | ConvertFrom-Json
          $expectedProjects = @(
            "Promptly.Application/Promptly.Application.csproj"
            "Promptly.Cli/Promptly.Cli.csproj"
            "Promptly.Domain/Promptly.Domain.csproj"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj"
            "Promptly.Sdk.DotNet/Promptly.Sdk.DotNet.csproj"
            "Promptly.Server/Promptly.Server.csproj"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj"
            "tests/Promptly.IntegrationTests/Promptly.IntegrationTests.csproj"
          ) | Sort-Object
          $actualProjects = @(
            $scan.projects.path | ForEach-Object {
              [IO.Path]::GetRelativePath((Get-Location).Path, $_).Replace('\', '/')
            }
          ) | Sort-Object
          $projectDifference = Compare-Object $expectedProjects $actualProjects
          if ($projectDifference) {
            throw "Unexpected .NET dependency-scan cohort: $($projectDifference | Out-String)"
          }

          $actualFindings = @()
          foreach ($project in $scan.projects) {
            $projectPath = [IO.Path]::GetRelativePath((Get-Location).Path, $project.path)
            $projectPath = $projectPath.Replace('\', '/')
            foreach ($framework in @($project.frameworks)) {
              $targetFramework = ([string]$framework.framework).Trim().ToLowerInvariant()
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages) `
                | Where-Object { $_ }
              foreach ($package in $packages) {
                foreach ($finding in @($package.vulnerabilities) | Where-Object { $_ }) {
                  $advisory = $finding.advisoryurl -replace '^.*/', ''
                  $actualFindings += "$projectPath|$targetFramework|$($package.id)|$($package.resolvedVersion)|$($finding.severity)|$advisory"
                }
              }
            }
          }
          $actualFindings = @($actualFindings | Sort-Object -Unique)
          if ($actualFindings.Count -gt 0) {
            throw "Vulnerable .NET dependencies reported: $($actualFindings -join ', ')"
          }
          Write-Host "No vulnerable .NET dependencies reported"

      - name: Diagnose worker lifecycle fixture eight times
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="artifacts/test-results/csharp/worker-lifecycle"
          test_name="Promptly.Application.UnitTests.TestRunWorkerServiceTests.Worker_honors_configured_concurrency_and_stop_waits_for_in_flight_processing"
          rm -rf "$diagnostic_root"
          mkdir -p "$diagnostic_root"

          for iteration in $(seq 1 8); do
            results_dir="$diagnostic_root/run-$iteration"
            mkdir -p "$results_dir"
            dotnet test tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj \
              --configuration Release \
              --no-build \
              --no-restore \
              -p:CollectCoverage=false \
              --filter "FullyQualifiedName~$test_name" \
              --logger "trx;LogFileName=worker-lifecycle.trx" \
              --results-directory "$results_dir"

            trx_path="$results_dir/worker-lifecycle.trx"
            if [[ ! -s "$trx_path" ]]; then
              echo "Worker lifecycle diagnostic TRX is missing or empty: $trx_path" >&2
              exit 1
            fi

            python3 - "$trx_path" "$test_name" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          trx_path, expected_name = sys.argv[1:]
          root = ET.parse(trx_path).getroot()

          def local_name(tag):
              return tag.rsplit("}", 1)[-1]

          counters = next(
              element for element in root.iter()
              if local_name(element.tag) == "Counters")
          count = lambda name: int(counters.attrib.get(name, "0"))
          results = [
              element for element in root.iter()
              if local_name(element.tag) == "UnitTestResult"]
          if (
              count("total") != 1
              or count("executed") != 1
              or count("passed") != 1
              or count("failed") != 0
              or count("notExecuted") != 0
              or len(results) != 1
              or results[0].attrib.get("testName") != expected_name
              or results[0].attrib.get("outcome") != "Passed"
          ):
              raise SystemExit(
                  f"Unexpected worker lifecycle diagnostic result in {trx_path}: "
                  f"counters={counters.attrib!r}, "
                  f"results={[result.attrib for result in results]!r}")
          print(f"Verified one passing worker lifecycle test with no skips: {trx_path}")
          PY
          done

      - name: Run application unit tests and coverage gate
        run: >-
          dotnet test tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj
          --configuration Release
          --no-build
          --settings tests/Promptly.runsettings
          --logger "trx;LogFileName=Promptly.Application.UnitTests.trx"
          --results-directory artifacts/test-results/csharp

      - name: Require complete measured C# cohort
        shell: pwsh
        run: |
          $trxPath = "artifacts/test-results/csharp/Promptly.Application.UnitTests.trx"
          if (!(Test-Path $trxPath) -or (Get-Item $trxPath).Length -eq 0) {
            throw "Application unit-test TRX is missing or empty"
          }

          [xml]$report = Get-Content $trxPath -Raw
          $counters = $report.TestRun.ResultSummary.Counters
          if ([int]$counters.total -lt 900) {
            throw "Expected at least 900 application unit tests, found $($counters.total)"
          }

          $expectedSkippedTests = @(
            "Promptly.Application.UnitTests.PythonWorkerLiveContractTests.Health_ready_supports_OpenAI_and_AzureOpenAI_wire_contracts"
            "Promptly.Application.UnitTests.PythonWorkerLiveContractTests.PythonEvalClient_round_trips_through_real_FastAPI_and_local_provider"
          ) | Sort-Object
          $unitResults = @($report.TestRun.Results.UnitTestResult)
          $actualSkippedTests = @(
            $unitResults |
              Where-Object { [string]$_.outcome -ne "Passed" } |
              ForEach-Object { [string]$_.testName }
          ) | Sort-Object
          $skipDifference = Compare-Object $expectedSkippedTests $actualSkippedTests
          if ($skipDifference) {
            throw "Unexpected application unit-test skip/failure cohort: $($skipDifference | Out-String)"
          }

          $expectedExecuted = [int]$counters.total - $expectedSkippedTests.Count
          if ([int]$counters.executed -ne $expectedExecuted -or
              [int]$counters.passed -ne $expectedExecuted -or
              [int]$counters.failed -ne 0) {
            throw "Application unit-test TRX contains unexpected skips or failures"
          }

          $requiredAuthenticationTests = @(
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.ClientGateIsAtomicUnderConcurrency"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.Ipv6SixtyFourPrefixSharesClientWindowAndDifferentPrefixIsIsolated"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.SameAccountContentionRejectsImmediatelyAndRecoversAfterDispose"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.CanceledImmediateAttemptThrowsWithoutReleasingHolder"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.SameStripeDifferentAccountsHaveZeroQueuedWaitersUnderConcurrency"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.HeldAccountStripeRejectsBarrierStartedContendersWithoutConsumingQuota"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.SprayTrackingCapacityFailureRejectsThresholdMutation"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.GlobalSprayEntryCapIsExactWithoutEmptyStateLeakAndRecoversOnExpiry"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.SprayThresholdClearsGlobalEntryBudgetAndOtherCohortsRemainAvailable"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.ExhaustingEachCapacityCohortDoesNotDenyOtherCohorts"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.CapacityRetryUsesEarliestFixedOrSprayExpiry"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.ActiveSprayBlockRejectsBeforeConsumingAccountPermitThenRecovers"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.Ipv6SixtyFourPrefixSharesSprayBlockAndDifferentPrefixIsIsolated"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseGuardTests.BoundedEvictionCursorReclaimsExpiredStateBehindSixtyFourLiveStatesOnNextProbe"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Admitted_login_success_completes_when_spray_block_activates_during_verification"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Login_records_a_completed_wrong_password_before_honoring_cancellation"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Register_rejects_overlong_fields_before_account_or_identity_work"; Count = 3 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Login_rejects_overlong_email_before_account_or_credential_work"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Login_accepts_legacy_password_above_the_registration_limit"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Authentication_models_accept_values_at_the_documented_limits"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthControllerTests.Authentication_actions_publish_the_request_body_limit"; Count = 2 }
            @{ BaseName = "Promptly.Application.UnitTests.IdentityCredentialVerifierTests.Completed_wrong_password_returns_for_accounting_even_when_verification_cancels"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.IdentityCredentialVerifierTests.Threshold_crossing_wrong_password_does_not_repeat_dummy_password_work"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.IdentityCredentialVerifierTests.Already_locked_user_runs_dummy_password_work_and_remains_generic"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseOptionsValidatorTests.Maximum_tracked_spray_entries_must_cover_spray_cardinality"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseOptionsValidatorTests.Broad_public_proxy_networks_require_exact_host_routes"; Count = 2 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseOptionsValidatorTests.Trusted_proxy_network_count_is_bounded"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationPartitionKeyProviderTests.Ipv6ClientPartitionsAggregateAtSixtyFourBits"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationThrottleResponseWriterTests.WriteAsyncProducesStablePrivateProblemContract"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.RejectionShortCircuitsAndForwardsRequestAbortToWriter"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.OversizedKnownLengthReturns413AfterClientAdmissionWithoutInvokingNext"; Count = 2 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.BodyAtExactLimitInvokesNext"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.OversizedUnknownLengthReturns413IndependentlyOfTransportFeature"; Count = 3 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.ValidUnknownLengthBodyIsBufferedForDownstreamAndOriginalStreamIsRestored"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.ThrottledUnknownLengthRequestIsRejectedWithoutReadingBody"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.Transport413WhileBufferingReturnsPrivateNoStore413"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.StricterWritableTransportBodyLimitIsPreserved"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.StricterTransportBodyLimitRejectsKnownAndUnknownLengths"; Count = 4 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.ClientAdmissionRunsBeforeAggregateAdmissionAndDownstream"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.AggregateRejectionReturnsGeneric429WithoutReadingBody"; Count = 2 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.AdmissionLeaseRemainsHeldUntilDownstreamResponseCompletes"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.DownstreamExceptionPropagatesAndReleasesAdmission"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.RequestCancellationWhileReadingBodyReleasesAdmission"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.ConcurrentAttemptsAdmitExactlyConfiguredCeilingWithoutQueueing"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.LoginAndRegistrationShareOneProcessWideCeiling"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.LeaseReleaseIsIdempotentAndCapacityRecoversExactlyOnce"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.ConstructorAndOperationValidateInputs"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.MetricsUseExactNamesAndOnlyBoundedOperationTags"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.InFlightGaugeReportsCurrentStateForLateAndRenewedSubscriptions"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.ThrowingMetricListenerCannotLeakCapacityOrEscapeAdmissionOperations"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.ThrowingInstrumentPublicationCannotPoisonAdmissionInitialization"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationRequestAdmissionGateTests.InFlightGaugeSnapshotNeverExceedsCeilingDuringConcurrentHandoffs"; Count = 1 }
            @{ BaseName = "Promptly.Application.UnitTests.AuthenticationAbuseMiddlewareTests.NullAdmissionGateIsRejected"; Count = 1 }
          )
          $passedNames = @(
            $unitResults |
              Where-Object { [string]$_.outcome -eq "Passed" } |
              ForEach-Object { [string]$_.testName }
          )
          foreach ($requiredTest in $requiredAuthenticationTests) {
            $matches = @(
              $passedNames | Where-Object {
                $_ -eq $requiredTest.BaseName -or
                  $_.StartsWith(
                    "$($requiredTest.BaseName)(",
                    [System.StringComparison]::Ordinal)
              }
            )
            if ($matches.Count -ne $requiredTest.Count) {
              throw "Required authentication unit test count mismatch for $($requiredTest.BaseName): expected $($requiredTest.Count), found $($matches.Count)"
            }
          }

          [xml]$coverage = Get-Content artifacts/test-results/csharp/coverage/coverage.cobertura.xml -Raw
          $packages = @($coverage.coverage.packages.package)
          $expectedAssemblies = @(
            "Promptly.Application"
            "Promptly.Infrastructure"
            "Promptly.Server"
          ) | Sort-Object
          $actualAssemblies = @(
            $packages |
              Where-Object { @($_.classes.class).Count -gt 0 } |
              ForEach-Object { [string]$_.name }
          ) | Sort-Object
          $assemblyDifference = Compare-Object $expectedAssemblies $actualAssemblies
          if ($assemblyDifference) {
            throw "Unexpected measured C# assembly cohort: $($assemblyDifference | Out-String)"
          }

          function Get-RepositoryRelativePath([string]$path) {
            $fullPath = if ([IO.Path]::IsPathRooted($path)) {
              [IO.Path]::GetFullPath($path)
            }
            else {
              [IO.Path]::GetFullPath((Join-Path (Get-Location).Path $path))
            }
            return [IO.Path]::GetRelativePath((Get-Location).Path, $fullPath).Replace('\', '/')
          }

          $expectedInfrastructureSources = @(
            Get-ChildItem Promptly.Infrastructure -Filter *.cs -Recurse |
              Where-Object { $_.FullName -notmatch '[/\\](bin|obj)[/\\]' } |
              ForEach-Object { Get-RepositoryRelativePath $_.FullName }
          ) | Sort-Object -Unique
          $infrastructurePackage = $packages |
            Where-Object { $_.name -eq "Promptly.Infrastructure" } |
            Select-Object -First 1
          $actualInfrastructureSources = @(
            $infrastructurePackage.classes.class |
              ForEach-Object { Get-RepositoryRelativePath ([string]$_.filename) }
          ) | Sort-Object -Unique
          $infrastructureDifference = Compare-Object `
            $expectedInfrastructureSources `
            $actualInfrastructureSources
          if ($infrastructureDifference) {
            throw "Incomplete Infrastructure coverage source cohort: $($infrastructureDifference | Out-String)"
          }

          $expectedApplicationSources = @(
            "Promptly.Application/Data/ExecutableRunQueries.cs"
            "Promptly.Application/Data/TenantOwnedQueries.cs"
            "Promptly.Application/Models/EndpointDestinationPolicy.cs"
            "Promptly.Application/Models/EndpointEgressOptions.cs"
            "Promptly.Application/Models/EndpointTargetPolicy.cs"
            "Promptly.Application/Services/BoundedRegexMatcher.cs"
            "Promptly.Application/Services/EndpointDestinationGuard.cs"
            "Promptly.Application/Services/EndpointExecutor.cs"
            "Promptly.Application/Services/EndpointService.cs"
            "Promptly.Application/Services/EnvironmentService.cs"
            "Promptly.Application/Services/ExpectationEvaluator.cs"
            "Promptly.Application/Services/MappingService.cs"
            "Promptly.Application/Services/ProjectService.cs"
            "Promptly.Application/Services/TestCaseService.cs"
            "Promptly.Application/Services/TestRunProcessor.cs"
            "Promptly.Application/Services/TestRunService.cs"
            "Promptly.Application/Services/TestRunWorkerStore.cs"
            "Promptly.Application/Services/TestSuiteService.cs"
          ) | Sort-Object
          $applicationPackage = $packages |
            Where-Object { $_.name -eq "Promptly.Application" } |
            Select-Object -First 1
          $actualApplicationSources = @(
            $applicationPackage.classes.class |
              ForEach-Object { Get-RepositoryRelativePath ([string]$_.filename) }
          ) | Sort-Object -Unique
          $applicationDifference = Compare-Object `
            $expectedApplicationSources `
            $actualApplicationSources
          if ($applicationDifference) {
            throw "Unexpected scoped Application coverage cohort: $($applicationDifference | Out-String)"
          }

          $expectedServerSources = @(
            "Promptly.Server/Controllers/AuthController.cs"
            "Promptly.Server/Controllers/EndpointsController.cs"
            "Promptly.Server/Controllers/EnvironmentsController.cs"
            "Promptly.Server/Controllers/MappingController.cs"
            "Promptly.Server/Controllers/ProjectsController.cs"
            "Promptly.Server/Controllers/RunsController.cs"
            "Promptly.Server/Controllers/TestSuitesController.cs"
            "Promptly.Server/Controllers/TestsController.cs"
            "Promptly.Server/Models/AuthModels.cs"
            "Promptly.Server/Security/AuthenticationAbuseGuard.cs"
            "Promptly.Server/Security/AuthenticationAbuseMiddleware.cs"
            "Promptly.Server/Security/AuthenticationAbuseOptions.cs"
            "Promptly.Server/Security/AuthenticationRequestAdmissionGate.cs"
            "Promptly.Server/Security/AuthenticationPartitionKeyProvider.cs"
            "Promptly.Server/Security/AuthenticationThrottleResponseWriter.cs"
            "Promptly.Server/Security/HttpContextTenantAccessScopeAccessor.cs"
            "Promptly.Server/Security/IdentityCredentialVerifier.cs"
            "Promptly.Server/Security/TenantAccessScopeFactory.cs"
            "Promptly.Server/Security/TenantAuthenticationSchemeSelector.cs"
            "Promptly.Server/Services/TestRunWorkerService.cs"
          ) | Sort-Object
          $serverPackage = $packages |
            Where-Object { $_.name -eq "Promptly.Server" } |
            Select-Object -First 1
          $actualServerSources = @(
            $serverPackage.classes.class |
              ForEach-Object { Get-RepositoryRelativePath ([string]$_.filename) }
          ) | Sort-Object -Unique
          $serverDifference = Compare-Object `
            $expectedServerSources `
            $actualServerSources
          if ($serverDifference) {
            throw "Unexpected scoped Server coverage cohort: $($serverDifference | Out-String)"
          }

          foreach ($package in @($applicationPackage, $infrastructurePackage, $serverPackage)) {
            $lineRate = [double]::Parse(
              [string]$package.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            $branchRate = [double]::Parse(
              [string]$package.'branch-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($lineRate -lt 0.90 -or $branchRate -lt 0.90) {
              throw "Coverage for $($package.name) is below 90%: line=$lineRate branch=$branchRate"
            }
            Write-Host "$($package.name): line=$('{0:P2}' -f $lineRate) branch=$('{0:P2}' -f $branchRate)"
          }

          $requiredApplicationClasses = @(
            "Promptly.Application.Data.ExecutableRunQueries"
            "Promptly.Application.Data.TenantOwnedQueries"
            "Promptly.Application.Models.AllowedNonPublicDestinationRule"
            "Promptly.Application.Models.EndpointDestinationPolicy"
            "Promptly.Application.Models.EndpointDestinationRejectedException"
            "Promptly.Application.Models.EndpointEgressOptions"
            "Promptly.Application.Models.EndpointTargetAttribute"
            "Promptly.Application.Models.EndpointTargetPolicy"
            "Promptly.Application.Models.EndpointTargetValidationException"
            "Promptly.Application.Models.EnvironmentBaseUrlAttribute"
            "Promptly.Application.Models.EnvironmentBaseUrlValidationException"
            "Promptly.Application.Services.BoundedRegexMatcher"
            "Promptly.Application.Services.EndpointDestinationGuard"
            "Promptly.Application.Services.EndpointExecutor"
            "Promptly.Application.Services.EndpointService"
            "Promptly.Application.Services.EnvironmentService"
            "Promptly.Application.Services.ExpectationEvaluator"
            "Promptly.Application.Services.MappingService"
            "Promptly.Application.Services.MappingSpecValidationException"
            "Promptly.Application.Services.ProjectService"
            "Promptly.Application.Services.TestCaseService"
            "Promptly.Application.Services.TestRunProcessor"
            "Promptly.Application.Services.TestRunService"
            "Promptly.Application.Services.TestRunWorkerStore"
            "Promptly.Application.Services.TestSuiteService"
          ) | Sort-Object
          $actualTopLevelClasses = @(
            $applicationPackage.classes.class |
              Where-Object { ([string]$_.name) -notmatch '/' } |
              ForEach-Object { [string]$_.name }
          ) | Sort-Object -Unique
          $classDifference = Compare-Object $requiredApplicationClasses $actualTopLevelClasses
          if ($classDifference) {
            throw "Unexpected top-level Application coverage class cohort: $($classDifference | Out-String)"
          }
          foreach ($className in $requiredApplicationClasses) {
            $class = @($applicationPackage.classes.class) |
              Where-Object { $_.name -eq $className } |
              Select-Object -First 1
            if (-not $class) {
              throw "Required covered class is missing: $className"
            }
            $classLineRate = [double]::Parse(
              [string]$class.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            $classBranchRate = [double]::Parse(
              [string]$class.'branch-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($classLineRate -lt 0.90 -or $classBranchRate -lt 0.90) {
              throw "Coverage for $className is below 90%: line=$classLineRate branch=$classBranchRate"
            }
            Write-Host "${className}: line=$('{0:P2}' -f $classLineRate) branch=$('{0:P2}' -f $classBranchRate)"
          }

          $requiredServerClasses = @(
            "Promptly.Server.Controllers.AuthController"
            "Promptly.Server.Controllers.EndpointsController"
            "Promptly.Server.Controllers.EnvironmentsController"
            "Promptly.Server.Controllers.MappingController"
            "Promptly.Server.Controllers.ProjectsController"
            "Promptly.Server.Controllers.RunsController"
            "Promptly.Server.Controllers.TestSuitesController"
            "Promptly.Server.Controllers.TestsController"
            "Promptly.Server.Models.AuthResponse"
            "Promptly.Server.Models.LoginRequest"
            "Promptly.Server.Models.RegisterRequest"
            "Promptly.Server.Models.UserInfo"
            "Promptly.Server.Security.AuthenticationAbuseGuard"
            "Promptly.Server.Security.AuthenticationAbuseOperationAttribute"
            "Promptly.Server.Security.AuthenticationAbuseMiddleware"
            "Promptly.Server.Security.AuthenticationAbuseOptions"
            "Promptly.Server.Security.AuthenticationAbuseOptionsValidator"
            "Promptly.Server.Security.AuthenticationRequestAdmissionGate"
            "Promptly.Server.Security.AuthenticationRequestAdmissionMetrics"
            "Promptly.Server.Security.AuthenticationAccountAttempt"
            "Promptly.Server.Security.AuthenticationPartitionKeyProvider"
            "Promptly.Server.Security.AuthenticationThrottleDecision"
            "Promptly.Server.Security.AuthenticationThrottleResponseWriter"
            "Promptly.Server.Security.HttpContextTenantAccessScopeAccessor"
            "Promptly.Server.Security.IdentityCredentialVerifier"
            "Promptly.Server.Security.InvalidCredentialPasswordVerifier"
            "Promptly.Server.Security.TenantAccessScopeFactory"
            "Promptly.Server.Security.TenantAuthenticationSchemeSelector"
            "Promptly.Server.Services.TestRunWorkerService"
          ) | Sort-Object
          $actualTopLevelServerClasses = @(
            $serverPackage.classes.class |
              Where-Object { ([string]$_.name) -notmatch '/' } |
              ForEach-Object { [string]$_.name }
          ) | Sort-Object -Unique
          $serverClassDifference = Compare-Object `
            $requiredServerClasses `
            $actualTopLevelServerClasses
          if ($serverClassDifference) {
            throw "Unexpected top-level Server coverage class cohort: $($serverClassDifference | Out-String)"
          }
          foreach ($className in $requiredServerClasses) {
            $class = @($serverPackage.classes.class) |
              Where-Object { $_.name -eq $className } |
              Select-Object -First 1
            if (-not $class) {
              throw "Required covered class is missing: $className"
            }
            $classLineRate = [double]::Parse(
              [string]$class.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            $classBranchRate = [double]::Parse(
              [string]$class.'branch-rate',
              [Globalization.CultureInfo]::InvariantCulture)
            if ($classLineRate -lt 0.90 -or $classBranchRate -lt 0.90) {
              throw "Coverage for $className is below 90%: line=$classLineRate branch=$classBranchRate"
            }
            Write-Host "${className}: line=$('{0:P2}' -f $classLineRate) branch=$('{0:P2}' -f $classBranchRate)"
          }

          # Coverlet represents async method bodies as generated nested classes.
          # Enforce the threshold by source file as well as package so an exact
          # top-level class filter cannot accidentally count only constructors.
          $coverageJson = Get-Content artifacts/test-results/csharp/coverage/coverage.json -Raw |
            ConvertFrom-Json -AsHashtable

          function Get-SourceCoverage(
            [string]$assemblyName,
            [string]$sourcePath
          ) {
            $assembly = $coverageJson["$assemblyName.dll"]
            if (-not $assembly) {
              throw "Coverage JSON is missing assembly $assemblyName"
            }

            $sourceKeys = @(
              $assembly.Keys |
                Where-Object { (Get-RepositoryRelativePath ([string]$_)) -eq $sourcePath }
            )
            if ($sourceKeys.Count -ne 1) {
              throw "Expected one coverage JSON source for ${sourcePath}; found $($sourceKeys.Count)"
            }

            $lineHits = @{}
            $branchHits = @{}
            foreach ($classEntry in $assembly[$sourceKeys[0]].GetEnumerator()) {
              foreach ($methodEntry in $classEntry.Value.GetEnumerator()) {
                $method = $methodEntry.Value
                foreach ($line in $method.Lines.GetEnumerator()) {
                  $hits = [int]$line.Value
                  if (-not $lineHits.ContainsKey($line.Key) -or $hits -gt $lineHits[$line.Key]) {
                    $lineHits[$line.Key] = $hits
                  }
                }
                foreach ($branch in @($method.Branches)) {
                  if (-not $branch) {
                    continue
                  }
                  $branchKey = @(
                    $classEntry.Key
                    $methodEntry.Key
                    $branch.Line
                    $branch.Offset
                    $branch.EndOffset
                    $branch.Path
                    $branch.Ordinal
                  ) -join '|'
                  $hits = [int]$branch.Hits
                  if (-not $branchHits.ContainsKey($branchKey) -or $hits -gt $branchHits[$branchKey]) {
                    $branchHits[$branchKey] = $hits
                  }
                }
              }
            }

            if ($lineHits.Count -eq 0) {
              throw "Coverage JSON has no executable lines for ${sourcePath}"
            }

            $coveredLines = @($lineHits.Values | Where-Object { $_ -gt 0 }).Count
            $coveredBranches = @($branchHits.Values | Where-Object { $_ -gt 0 }).Count
            return [pscustomobject]@{
              LineRate = $coveredLines / $lineHits.Count
              BranchRate = if ($branchHits.Count -eq 0) {
                1.0
              }
              else {
                $coveredBranches / $branchHits.Count
              }
            }
          }

          foreach ($sourcePath in $expectedInfrastructureSources) {
            $sourceCoverage = Get-SourceCoverage "Promptly.Infrastructure" $sourcePath
            if ($sourceCoverage.LineRate -lt 0.90 -or $sourceCoverage.BranchRate -lt 0.90) {
              throw "Coverage for $sourcePath is below 90%: line=$($sourceCoverage.LineRate) branch=$($sourceCoverage.BranchRate)"
            }
            Write-Host "${sourcePath}: line=$('{0:P2}' -f $sourceCoverage.LineRate) branch=$('{0:P2}' -f $sourceCoverage.BranchRate)"
          }

          foreach ($sourcePath in $expectedApplicationSources) {
            $sourceCoverage = Get-SourceCoverage "Promptly.Application" $sourcePath
            if ($sourceCoverage.LineRate -lt 0.90 -or $sourceCoverage.BranchRate -lt 0.90) {
              throw "Coverage for $sourcePath is below 90%: line=$($sourceCoverage.LineRate) branch=$($sourceCoverage.BranchRate)"
            }
            Write-Host "${sourcePath}: line=$('{0:P2}' -f $sourceCoverage.LineRate) branch=$('{0:P2}' -f $sourceCoverage.BranchRate)"
          }

          foreach ($sourcePath in $expectedServerSources) {
            $sourceCoverage = Get-SourceCoverage "Promptly.Server" $sourcePath
            if ($sourceCoverage.LineRate -lt 0.90 -or $sourceCoverage.BranchRate -lt 0.90) {
              throw "Coverage for $sourcePath is below 90%: line=$($sourceCoverage.LineRate) branch=$($sourceCoverage.BranchRate)"
            }
            Write-Host "${sourcePath}: line=$('{0:P2}' -f $sourceCoverage.LineRate) branch=$('{0:P2}' -f $sourceCoverage.BranchRate)"
          }

      - name: Require test and coverage artifacts
        shell: pwsh
        run: |
          $requiredArtifacts = @(
            "artifacts/test-results/csharp/Promptly.Application.UnitTests.trx",
            "artifacts/test-results/csharp/coverage/coverage.cobertura.xml",
            "artifacts/test-results/csharp/coverage/coverage.json",
            "artifacts/test-results/csharp/dotnet-vulnerabilities.json"
          )
          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path -Path $artifact -PathType Leaf) -or (Get-Item $artifact).Length -eq 0) {
              throw "Required verification artifact is missing or empty: $artifact"
            }
          }

      - name: Upload test and coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-test-results
          path: artifacts/test-results/csharp
          if-no-files-found: error
          retention-days: 14
