version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/Promptly.Application"
      - "/Promptly.Cli"
      - "/Promptly.Domain"
      - "/Promptly.Infrastructure"
      - "/Promptly.Sdk.DotNet"
      - "/Promptly.Server"
      - "/tests/Promptly.Application.UnitTests"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Chicago

  - package-ecosystem: npm
    directory: "/Promptly.Web/src/web"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: America/Chicago

  - package-ecosystem: uv
    directory: "/Promptly.Worker"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/Chicago

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: America/Chicago
