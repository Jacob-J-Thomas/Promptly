name: Application verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-verification:
    name: Application verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Promptly.slnx --locked-mode

      - name: Build
        run: dotnet build Promptly.slnx --configuration Release --no-restore

      - name: Clean application test artifacts
        shell: pwsh
        run: |
          Remove-Item artifacts/test-results/csharp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item artifacts/test-results/csharp -ItemType Directory -Force | Out-Null

      - name: Inventory vulnerable .NET dependencies
        shell: pwsh
        run: |
          dotnet package list `
            --project Promptly.slnx `
            --vulnerable `
            --include-transitive `
            --format json `
            --no-restore `
            | Out-File artifacts/test-results/csharp/dotnet-vulnerabilities.json -Encoding utf8

      - name: Require complete dependency-scan cohort
        shell: pwsh
        run: |
          $scan = Get-Content artifacts/test-results/csharp/dotnet-vulnerabilities.json -Raw | ConvertFrom-Json
          $expectedProjects = @(
            "Promptly.Application/Promptly.Application.csproj"
            "Promptly.Cli/Promptly.Cli.csproj"
            "Promptly.Domain/Promptly.Domain.csproj"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj"
            "Promptly.Sdk.DotNet/Promptly.Sdk.DotNet.csproj"
            "Promptly.Server/Promptly.Server.csproj"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj"
          ) | Sort-Object
          $actualProjects = @(
            $scan.projects.path | ForEach-Object {
              [IO.Path]::GetRelativePath((Get-Location).Path, $_).Replace('\', '/')
            }
          ) | Sort-Object
          $projectDifference = Compare-Object $expectedProjects $actualProjects
          if ($projectDifference) {
            throw "Unexpected .NET dependency-scan cohort: $($projectDifference | Out-String)"
          }

          # Temporary exact baseline for the already tracked #21 debt. This is not a waiver:
          # any new advisory or spread to another project/framework fails immediately, and the
          # baseline expires unless #21 removes it.
          $baselineExpiry = [DateTimeOffset]::Parse("2026-08-19T00:00:00Z")
          $allowedFindings = @(
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-23rf-6693-g89p"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-37gx-xxp4-5rgx"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-6588-8gv4-xfgh"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-8q5v-6pqq-x66h"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-cvvh-rhrc-wg4q"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-g8r8-53c2-pm3f"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-mmjf-rqrv-855v"
            "Promptly.Application/Promptly.Application.csproj|net10.0|System.Security.Cryptography.Xml|9.0.0|High|GHSA-w3x6-4m5h-cxqf"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|Microsoft.AspNetCore.DataProtection|10.0.0|Critical|GHSA-9mv3-2cwr-p262"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-23rf-6693-g89p"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-37gx-xxp4-5rgx"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-6588-8gv4-xfgh"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-8q5v-6pqq-x66h"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-cvvh-rhrc-wg4q"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-g8r8-53c2-pm3f"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-mmjf-rqrv-855v"
            "Promptly.Infrastructure/Promptly.Infrastructure.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-w3x6-4m5h-cxqf"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|Microsoft.AspNetCore.DataProtection|10.0.0|Critical|GHSA-9mv3-2cwr-p262"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-23rf-6693-g89p"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-37gx-xxp4-5rgx"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-6588-8gv4-xfgh"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-8q5v-6pqq-x66h"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-cvvh-rhrc-wg4q"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-g8r8-53c2-pm3f"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-mmjf-rqrv-855v"
            "tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj|net10.0|System.Security.Cryptography.Xml|10.0.0|High|GHSA-w3x6-4m5h-cxqf"
          )
          $actualFindings = @()
          foreach ($project in $scan.projects) {
            $projectPath = [IO.Path]::GetRelativePath((Get-Location).Path, $project.path)
            $projectPath = $projectPath.Replace('\', '/')
            foreach ($framework in @($project.frameworks)) {
              $targetFramework = ([string]$framework.framework).Trim().ToLowerInvariant()
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages) `
                | Where-Object { $_ }
              foreach ($package in $packages) {
                foreach ($finding in @($package.vulnerabilities) | Where-Object { $_ }) {
                  $advisory = $finding.advisoryurl -replace '^.*/', ''
                  $actualFindings += "$projectPath|$targetFramework|$($package.id)|$($package.resolvedVersion)|$($finding.severity)|$advisory"
                }
              }
            }
          }
          $actualFindings = @($actualFindings | Sort-Object -Unique)
          $unexpectedFindings = @($actualFindings | Where-Object { $_ -notin $allowedFindings })
          if ($unexpectedFindings.Count -gt 0) {
            throw "Untracked .NET vulnerability findings: $($unexpectedFindings -join ', ')"
          }
          if ($actualFindings.Count -eq 0) {
            Write-Host "No vulnerable .NET dependencies reported"
          }
          else {
            if ([DateTimeOffset]::UtcNow -ge $baselineExpiry) {
              throw "Issue #21 vulnerability baseline expired at $baselineExpiry"
            }
            Write-Warning (
              "Inventory contains {0} unique known findings tracked in #21; baseline expires {1:u}" `
                -f $actualFindings.Count, $baselineExpiry
            )
          }

      - name: Run application unit tests and coverage gate
        run: >-
          dotnet test tests/Promptly.Application.UnitTests/Promptly.Application.UnitTests.csproj
          --configuration Release
          --no-build
          --settings tests/Promptly.runsettings
          --logger "trx;LogFileName=Promptly.Application.UnitTests.trx"
          --results-directory artifacts/test-results/csharp

      - name: Require test and coverage artifacts
        shell: pwsh
        run: |
          $requiredArtifacts = @(
            "artifacts/test-results/csharp/Promptly.Application.UnitTests.trx",
            "artifacts/test-results/csharp/coverage/coverage.cobertura.xml",
            "artifacts/test-results/csharp/coverage/coverage.json",
            "artifacts/test-results/csharp/dotnet-vulnerabilities.json"
          )
          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path -Path $artifact -PathType Leaf) -or (Get-Item $artifact).Length -eq 0) {
              throw "Required verification artifact is missing or empty: $artifact"
            }
          }

      - name: Upload test and coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-test-results
          path: artifacts/test-results/csharp
          if-no-files-found: error
          retention-days: 14
